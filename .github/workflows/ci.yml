# Every push and pull request is tested (the audit, 2026-10-29: release.yml ran on version tags only, so nothing tested
# an ordinary push): the server's tests in the Dockerfile's own test stage (as a release builds them), the page's tests
# and type check, the app's JVM tests, and one version everywhere (scripts/version.sh). A release still builds from a
# version tag only (release.yml).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/version.sh --check

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha,scope=ci-test
          cache-to: type=gha,mode=max,scope=ci-test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain testDebugUnitTest
