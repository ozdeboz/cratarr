[package]
name = "cratarr-api"
description = "Cratarr's API: the page's routes, the MCP server, listening along and the guest portal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-app/test-support"]

[dependencies]
cratarr-app.workspace = true
anyhow.workspace = true
axum.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
cratarr-app = { workspace = true, features = ["test-support"] }
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
