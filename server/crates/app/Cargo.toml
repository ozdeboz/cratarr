[package]
name = "cratarr-app"
description = "Cratarr's app: playing, crates and playlists, discovery, requests, intake, the served library's routes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-health/test-support", "cratarr-search/test-support"]

[dependencies]
cratarr-health.workspace = true
cratarr-search.workspace = true
# The record as one object (DC1a): the domain's entity, card, row and chip, worked out from what this crate reads.
cratarr-domain.workspace = true
anyhow.workspace = true
flate2.workspace = true
image.workspace = true
ipnet.workspace = true
lofty.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
# Radio's modes are among the page's types the tests write, and live in the rules.
cratarr-rules = { workspace = true, features = ["ts", "made-up", "device"] }
cratarr-health = { workspace = true, features = ["test-support"] }
cratarr-search = { workspace = true, features = ["test-support"] }
cratarr-domain = { workspace = true, features = ["ts"] }
ts-rs.workspace = true
tokio = { workspace = true, features = ["test-util"] }
