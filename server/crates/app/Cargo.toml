[package]
name = "cratarr-app"
description = "Cratarr's app: playing, crates and playlists, discovery, requests, intake, the served library's routes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-requests/test-support", "cratarr-playing/test-support"]

[dependencies]
cratarr-requests.workspace = true
cratarr-playing.workspace = true
cratarr-rules.workspace = true
anyhow.workspace = true
axum.workspace = true
flate2.workspace = true
image.workspace = true
ipnet.workspace = true
libc.workspace = true
lofty.workspace = true
realfft.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tract-onnx.workspace = true
zip.workspace = true

[dev-dependencies]
# Radio's modes are among the page's types the tests write, and live in the rules.
cratarr-rules = { workspace = true, features = ["ts", "made-up", "device"] }
cratarr-requests = { workspace = true, features = ["test-support"] }
cratarr-playing = { workspace = true, features = ["test-support"] }
tower.workspace = true
ts-rs.workspace = true
tokio = { workspace = true, features = ["test-util"] }
