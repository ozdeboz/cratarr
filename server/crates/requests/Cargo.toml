[package]
name = "cratarr-requests"
description = "Cratarr's requests: requests, Soulseek, the turn, track fetches, intake cards, rooms, retention, Spotify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-records/test-support"]

[dependencies]
cratarr-records.workspace = true
cratarr-domain.workspace = true
cratarr-rules.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
image.workspace = true
lofty.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
cratarr-records = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
