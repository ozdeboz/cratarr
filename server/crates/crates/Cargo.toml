[package]
name = "cratarr-crates"
description = "Cratarr's crates: crates, Sounds like, the fits and the taste, Home's crates, what is excluded everywhere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-playlists/test-support"]

[dependencies]
cratarr-playlists.workspace = true
cratarr-rules.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cratarr-playlists = { workspace = true, features = ["test-support"] }
# The lower crates' test helpers move time on (`tokio::time::advance`).
tokio = { workspace = true, features = ["test-util"] }
