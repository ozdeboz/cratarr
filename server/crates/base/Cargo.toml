[package]
name = "cratarr-base"
description = "Cratarr's base: the app's shared services and what the areas above it share"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-served/test-support", "cratarr-runner/test-support", "dep:ts-rs"]

[dependencies]
cratarr-served.workspace = true
# The job runner (RN): its jobs, resources and words, below the base.
cratarr-runner.workspace = true
cratarr-rules.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
image.workspace = true
ipnet.workspace = true
libc.workspace = true
lofty.workspace = true
mp3lame-encoder.workspace = true
opusic-sys.workspace = true
# The bulk queue's stand-ins (track_intake_base::testing, test-support) answer as slskd and AcoustID do.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# The page's types: the app's hold base's (test-support only, as a dev-dependency today).
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
cratarr-served = { workspace = true, features = ["test-support"] }
cratarr-runner = { workspace = true, features = ["test-support"] }
# Radio's modes are among the page's types the tests write, and live in the rules.
cratarr-rules = { workspace = true, features = ["ts", "made-up", "device"] }
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
ts-rs.workspace = true
zip.workspace = true
