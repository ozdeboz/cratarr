[package]
name = "cratarr-domain"
description = "Cratarr's pure domain rules: who may do what with a record, its copies and its arrivals, and the arrival's machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

# The views' TypeScript (TY1, TY5): the crates above turn it on in their tests, as they write the page's generated types.
[features]
ts = ["dep:ts-rs"]

# Pure (DOMAIN-CORE §14): no I/O, no clock, no async, no app or store crate. It reads only what it is handed.
[dependencies]
cratarr-rules.workspace = true
serde.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
ts-rs.workspace = true
