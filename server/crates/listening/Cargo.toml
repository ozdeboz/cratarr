[package]
name = "cratarr-listening"
description = "Cratarr's listening: plays, scrobbles, history imports, resume"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-base/test-support"]

[dependencies]
cratarr-base.workspace = true
anyhow.workspace = true
getrandom.workspace = true
md-5.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cratarr-base = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
