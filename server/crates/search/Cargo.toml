[package]
name = "cratarr-search"
description = "Cratarr's search over records, tracks, artists, crates and what is missing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-incoming/test-support"]

[dependencies]
cratarr-incoming.workspace = true
cratarr-rules.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
cratarr-incoming = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
