[package]
name = "cratarr-clients"
description = "Cratarr's outside services: Jellyfin, Subsonic, Lidarr, slskd, Bandcamp, AcoustID, MusicBrainz, Snapcast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-store/test-support"]

[dependencies]
cratarr-store.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
md-5.workspace = true
reqwest.workspace = true
rusty-chromaprint.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cratarr-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
