[package]
name = "cratarr-media"
description = "Cratarr's sound and pictures: analysis, conversion, covers, the tape's rewind and wind"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = []

[dependencies]
cratarr-rules.workspace = true
anyhow.workspace = true
base64.workspace = true
ebur128.workspace = true
flacenc.workspace = true
image.workspace = true
lofty.workspace = true
md-5.workspace = true
realfft.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonia.workspace = true
taktus.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
