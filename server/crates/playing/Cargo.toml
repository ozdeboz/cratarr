[package]
name = "cratarr-playing"
description = "Cratarr's playing: Play On, the queue, devices, radio, home, playlists, the stream, the opus copies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library never ran doctests as the binary did not: the counts stay the same.
[lib]
doctest = false

[features]
# Test helpers and hooks, for the tests of the crates above: only dev-dependencies turn it on (SPLIT-PLAN 5.4).
test-support = ["cratarr-records/test-support", "dep:ts-rs"]

[dependencies]
cratarr-records.workspace = true
cratarr-rules.workspace = true
alac-encoder.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
flate2.workspace = true
getrandom.workspace = true
image.workspace = true
mp3lame-encoder.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symphonia.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
# The page's types: the app's hold playing's (test-support only, as a dev-dependency today).
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
cratarr-records = { workspace = true, features = ["test-support"] }
# Radio's modes are among the page's types the tests write, and live in the rules.
cratarr-rules = { workspace = true, features = ["ts", "made-up", "device"] }
flacenc.workspace = true
lofty.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
ts-rs.workspace = true
