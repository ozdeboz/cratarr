[package]
name = "cratarr-rules"
version = "0.1.0"
edition = "2024"
description = "Cratarr's rules for what plays and in what order: pure, for the server and for players that play on their own"
license = "AGPL-3.0-or-later"

# The page loads it as WebAssembly (wasm32-unknown-unknown, `cdylib`: the brake's and the matcher's plain exports); the server links it.
[lib]
crate-type = ["rlib", "cdylib"]

# Pure (no I/O, no clock, no randomness of its own): builds for wasm32-unknown-unknown as it is.
[features]
default = ["nfkd"]
# The matcher reads names as search reads them (NFKD, marks dropped): in the crate for the server; the page's
# WebAssembly leaves it to the browser (`--no-default-features`: its tables would be 100 KB of the page's first load).
nfkd = ["dep:unicode-normalization"]
# The WebAssembly modules (scripts/rules-wasm.sh): the brake for the page's first view, the matcher fetched later.
wasm-brake = []
wasm-matcher = []
# The library on a device, for the page: index.wasm, fetched when the page first keeps or reads it. It reads NFKD itself: the names
# it searches lie in its bytes, where the page cannot fold them, and it is no part of the page's first load.
wasm-index = ["device", "nfkd"]
# A crate's records kept apart, for the page (0.13): in matcher.wasm, which has an allocator already (in rules.wasm it
# took it from 9 to 38 KB).
wasm-spread = []
# Radio's modes in the page's generated types: the server's tests turn it on, as they write those. Nothing that plays
# builds it.
ts = ["dep:ts-rs"]
# A device answering for itself (`index::device`): crates, Sounds like and picks over what it keeps, JSON in and out. For the page's
# index.wasm and the app's bridge. Nothing on the server builds it but its tests.
device = ["dep:serde_json"]
# A library made up to the real one's size (`index::made_up`), to measure on a device. Nothing that plays builds it.
made-up = []

[dependencies]
# A quick hash for what a crate looks up by the tens of thousands, a file's line above all: the standard one guards against keys an
# attacker chose, and these are the library's own (rustc's own FxHash, no_std, wasm32 alike).
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
ts-rs = { version = "12.0.1", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
