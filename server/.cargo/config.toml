# The page's Play On types, generated by `cargo test` from the server's own (ts-rs, 0.10: one protocol). JSON sends
# every integer as a number, so the 64-bit ones are numbers there too, not bigint.
[env]
TS_RS_EXPORT_DIR = { value = "../web/src/lib/generated", relative = true }
TS_RS_LARGE_INT = "number"
