[package]
name = "cratarr-server"
version = "0.7.6"
edition = "2024"
description = "Cratarr core: Jellyfin playlist index and API"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
axum = "0.8"
# Hi-res to CD conversion (decision 0013). Exact pins, minimal features: lossless decoders only.
flacenc = { version = "=0.5.1", default-features = false }
lofty = "0.25.4"
# The Subsonic login token (source::subsonic).
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rubato = { version = "=5.0.0", default-features = false, features = ["fft_resampler"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "wav", "aiff", "pcm", "isomp4", "alac"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The page's live channel: an mpsc receiver as the SSE body.
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Reads back the exports' ZIPs in tests (decision 0007); stored entries only, so no compression features.
zip = { version = "2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Preview builds for trying a change on the NAS: the release build without its slow whole-program optimisation.
[profile.preview]
inherits = "release"
lto = false
codegen-units = 16
