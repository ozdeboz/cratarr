[package]
name = "cratarr-server"
version.workspace = true
edition.workspace = true
description = "Cratarr core: Jellyfin playlist index and API"
license.workspace = true
repository.workspace = true

# The rules for what plays and in what order (rules/), shared with players that play on their own; the server's own crates
# below this package, which holds the binary (crates/, SPLIT-PLAN.md).
[workspace]
members = [".", "rules", "crates/*"]
# Spike B's UniFFI crate is its own workspace (scripts/rules-android.sh).
exclude = ["rules-ffi"]

# One version for every package of the server (scripts/version.sh writes it).
[workspace.package]
version = "0.17.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ozdeboz/cratarr"

# Every dependency's one spec: each package names what its files use (`x.workspace = true`), so a dependency has the
# same features whichever package is built.
[workspace.dependencies]
anyhow = "1"
cratarr-rules = { path = "rules" }
# The pure domain (DOMAIN-CORE §14): above the rules, below the store.
cratarr-domain = { path = "crates/domain" }
axum = "0.8"
ipnet = "2"
# Hi-res to CD conversion (decision 0013). Exact pins, minimal features: lossless decoders only.
flacenc = { version = "=0.5.1", default-features = false }
lofty = "0.25.4"
# Smaller copies for the app's downloads (decision 0033, step 4): libopus, the reference encoder, built from its
# bundled source (needs cmake at build time).
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"] }
# Covers resized for the OpenSubsonic API (decision 0030); decoders for the pictures albums carry.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# The Subsonic login token (source::subsonic).
md-5 = "0.10"
# Sessions (decision 0039): tokens from the operating system's random source, kept only as their SHA-256.
getrandom = "0.3"
# A folder's free space (decision 0044): statvfs.
libc = "0.2"
# A directory asked first at sign-in (decision 0040); TLS through rustls as reqwest has it.
ldap3 = { version = "=0.12.1", default-features = false, features = ["tls-rustls-ring"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# functions (0.12): `cratarr_letters`, the library's trigram tables' folding (serve::library), no further crates.
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
rubato = { version = "=5.0.0", default-features = false, features = ["fft_resampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cratarr as an MCP server (0.13): the MCP Rust SDK (Apache-2.0), its streamable HTTP server on axum.
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
# The OpenSubsonic API's parameters, where a name may repeat (decision 0030).
serde_urlencoded = "0.7"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3", "wav", "aiff", "pcm", "isomp4", "alac", "aac", "ogg", "vorbis"] }
# Decision 0035: loudness (EBU R128, ReplayGain 2.0) and tempo with a confidence (one file, no dependency, no unsafe).
ebur128 = "0.1"
taktus = "=0.1.0"
# Decision 0046, amended: the visuals' signals, a short-time Fourier transform (already in the tree, through rubato).
realfft = "3.5"
# Decision 0049, amended: Beat this!'s small model on the NAS, pure Rust (the image is a static binary).
tract-onnx = "=0.21.19"
# Decision 0046: a track's beats in an analysis' JSON line (already in the tree, through reqwest).
base64 = "0.22"
thiserror = "2"
# Single-track replacement's gate (0.9.8): Chromaprint's fingerprint in pure Rust (MIT), on Symphonia's decode, as
# AcoustID takes it; no fpcalc binary.
rusty-chromaprint = "=0.3.0"
# Lossless and lossy forms for browsers whose media source refuses FLAC and Opus in MP4 (0.9.8, iOS): ALAC (Apple's
# encoder ported to Rust, Apache-2.0 OR MIT) and MP3 (LAME, LGPL-3.0, built from its bundled source).
alac-encoder = "=0.3.0"
mp3lame-encoder = "=0.2.5"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The page's live channel: an mpsc receiver as the SSE body.
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Reads a ListenBrainz export's zip (decision 0067; the exports' tests read back theirs, decision 0007): without its
# own compression features, so a deflated file comes raw and flate2 inflates it.
zip = { version = "2", default-features = false }
flate2 = "1"
# The tests' (dev-dependencies below).
cratarr-core = { path = "crates/core" }
cratarr-media = { path = "crates/media" }
cratarr-store = { path = "crates/store" }
cratarr-runner = { path = "crates/runner" }
cratarr-clients = { path = "crates/clients" }
cratarr-gate = { path = "crates/gate" }
cratarr-served = { path = "crates/served" }
cratarr-base = { path = "crates/base" }
cratarr-listening = { path = "crates/listening" }
cratarr-records = { path = "crates/records" }
cratarr-requests = { path = "crates/requests" }
cratarr-playlists = { path = "crates/playlists" }
cratarr-crates = { path = "crates/crates" }
cratarr-playing = { path = "crates/playing" }
cratarr-incoming = { path = "crates/incoming" }
cratarr-health = { path = "crates/health" }
cratarr-search = { path = "crates/search" }
cratarr-app = { path = "crates/app" }
cratarr-api = { path = "crates/api" }
ts-rs = "12.0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[dependencies]
cratarr-api.workspace = true
anyhow.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Every crate's test helpers and hooks (`test-support`): one feature set for the unit tests, `all` and e2e (SPLIT-PLAN 5.4).
cratarr-api = { workspace = true, features = ["test-support"] }
cratarr-app = { workspace = true, features = ["test-support"] }
cratarr-served = { workspace = true, features = ["test-support"] }
cratarr-base = { workspace = true, features = ["test-support"] }
cratarr-listening = { workspace = true, features = ["test-support"] }
cratarr-records = { workspace = true, features = ["test-support"] }
cratarr-requests = { workspace = true, features = ["test-support"] }
cratarr-playlists = { workspace = true, features = ["test-support"] }
cratarr-crates = { workspace = true, features = ["test-support"] }
cratarr-playing = { workspace = true, features = ["test-support"] }
cratarr-incoming = { workspace = true, features = ["test-support"] }
cratarr-health = { workspace = true, features = ["test-support"] }
cratarr-search = { workspace = true, features = ["test-support"] }
cratarr-gate = { workspace = true, features = ["test-support"] }
cratarr-clients = { workspace = true, features = ["test-support"] }
cratarr-store = { workspace = true, features = ["test-support"] }
cratarr-runner = { workspace = true, features = ["test-support"] }
cratarr-media = { workspace = true, features = ["test-support"] }
cratarr-core = { workspace = true, features = ["test-support"] }
# The page's types from the server's (generated, web/src/lib/generated): written by the tests, so a release build
# compiles none of it (0.14, faster previews: the dependency check's one lever).
ts-rs.workspace = true
# Radio's modes are among those types, and live in the rules.
cratarr-rules = { workspace = true, features = ["ts", "made-up", "device"] }
# Calls the routers as a client would, in tests (decision 0030).
tower.workspace = true
# Reads a stream as a client would (the players' events, a player's commands), in tests.
tokio-stream.workspace = true
# What the end-to-end suite (tests/e2e.rs) reads and writes beside the server it starts.
flate2.workspace = true
image.workspace = true
lofty.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sha2.workspace = true
# A paused clock for what waits its turn (MusicBrainz's, S10): its seconds pass at once, and exactly.
tokio = { workspace = true, features = ["test-util"] }

# The page's rules.wasm (scripts/rules-wasm.sh, 0.12): as small as it gets, the page loads it with its first view.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[profile.release]
opt-level = "s"
# Thin link-time optimisation over 16 units (2026-10-28, the owner: builds took 20 minutes): whole-program LTO in one
# unit re-optimised everything on each release; this keeps most of its gain at a fraction of the time.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

# Beat this! on the NAS (decision 0049, amended): tract's and the spectrogram's arithmetic at full speed; the rest stays
# built for size (all of it at full speed made the image 69 MB instead of 19).
[profile.release.package.tract-core]
opt-level = 3
[profile.release.package.tract-linalg]
opt-level = 3
[profile.release.package.tract-data]
opt-level = 3
[profile.release.package.tract-hir]
opt-level = 3
[profile.release.package.tract-onnx]
opt-level = 3
[profile.release.package.tract-onnx-opl]
opt-level = 3
[profile.release.package.tract-nnef]
opt-level = 3
[profile.release.package.ndarray]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3
[profile.release.package.realfft]
opt-level = 3

# The tests' arithmetic at full speed (TS01, the slow tests): the decoders, the encoder, the transforms, Beat this!'s model, the
# loudness, the pictures and SQLite, built optimised in the dev profile the tests run in; Cratarr's own crates stay as they are
# (unoptimised, with every check), and so does what these do. Built once, kept with the rest of the dependencies.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.flacenc]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.ebur128]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
