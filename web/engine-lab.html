<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Engine lab</title></head>
<body style="background:#0f1115;color:#e8eaf0;font:14px system-ui">
<!-- Development only (Vite builds index.html alone): plays a lab playlist through the real local player engine
     (lib/localPlayer.svelte.ts) and records its output silently for tools/gapless-lab/analyse.py.
     /engine-lab.html?auto=lab-flac|lab-mp3|lab-mixed&lab=http://localhost:5180 -->
<pre id="log"></pre>
<script type="module">
  import { playQueue, local, engineAudio, seek } from '/src/lib/localPlayer.svelte.ts';
  const log = (s) => (document.getElementById('log').textContent += s + '\n');
  const q = new URLSearchParams(location.search);
  const mode = q.get('auto') ?? 'lab-flac';
  const lab = q.get('lab') ?? 'http://localhost:5180';
  const SR = 44100;
  const ctx = new AudioContext({ sampleRate: SR });
  const worklet = `class C extends AudioWorkletProcessor { constructor() { super(); this.b = new Float32Array(8192); this.n = 0;
    this.port.onmessage = () => { if (this.n) this.port.postMessage(this.b.slice(0, this.n)); this.n = 0; }; }
    process(i, o) { const c = i[0] && i[0][0]; if (c) for (let k = 0; k < c.length; k++) { this.b[this.n++] = c[k];
    if (this.n === this.b.length) { this.port.postMessage(this.b.slice()); this.n = 0; } } if (o[0] && o[0][0]) o[0][0].fill(0); return true; } }
    registerProcessor('c', C);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'text/javascript' })));
  const node = new AudioWorkletNode(ctx, 'c', { outputChannelCount: [1] });
  const chunks = [];
  node.port.onmessage = (e) => chunks.push(e.data);
  ctx.createMediaElementSource(engineAudio()).connect(node);
  node.connect(ctx.destination);
  const events = [];
  const t0 = performance.now();
  const note = (s) => events.push(`${((performance.now() - t0) / 1000).toFixed(2)} ${s}`);
  for (const ev of ['playing', 'waiting', 'stalled', 'pause', 'ended', 'error']) engineAudio().addEventListener(ev, () => note(`${ev} ${engineAudio().currentTime.toFixed(3)}`));
  const r = await (await fetch(`/api/playlists/${mode}/tracks`)).json();
  playQueue(r.ids.map((id) => ({ source: r.source, id, name: '', artist: null, album: null, album_id: null })), 0);
  log(`playing ${mode}: ${r.ids.join(', ')}`);
  let sent = false;
  const done = async (why) => {
    if (sent) return;
    sent = true;
    node.port.postMessage('flush');
    await new Promise((res) => setTimeout(res, 400));
    const n = chunks.reduce((a, c) => a + c.length, 0), raw = new Float32Array(n);
    let o = 0;
    for (const c of chunks) { raw.set(c, o); o += c.length; }
    const id = `engine-${mode}`;
    await fetch(`${lab}/result?${id}`, { method: 'POST', body: JSON.stringify({ why, captured_s: n / SR, error: local.error, events }) });
    await fetch(`${lab}/capture?${id}`, { method: 'POST', body: raw.buffer });
    log(`${why}: sent ${(n / SR).toFixed(2)} s`);
  };
  engineAudio().addEventListener('ended', () => done('ended'), { once: true });
  setTimeout(() => done('timeout'), 60000);
</script>
</body>
</html>
